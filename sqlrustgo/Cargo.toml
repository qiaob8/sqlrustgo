[package]
name = "sqlrustgo"
version = "1.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
uuid = { version = "1.0", features = ["v4"] }

[lib]
name = "sqlrustgo"
path = "src/lib.rs"

[[bin]]
name = "sqlrustgo"
path = "src/main.rs"
